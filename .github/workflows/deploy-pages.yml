name: Deploy Pages

# Runs whenever either content-producing workflow finishes, merges their
# outputs, and does the single actual GitHub Pages deployment. Each producer
# workflow (regression-test, build-doc) only uploads its own content as a
# plain artifact; deploying it directly from either would wipe out whatever
# the other last published, since GitHub Pages deployment fully replaces the
# site on every deploy rather than merging.
on:
  workflow_run:
    workflows:
      - "Test - Regression"
      - "Build - HW documentation"
    types:
      - completed

jobs:
  merge_and_deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Find latest successful "Test - Regression" run
        id: find_regression_run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'regression-test.yml',
              status: 'success',
              per_page: 1,
            });
            if (runs.data.workflow_runs.length === 0) {
              core.setFailed('No successful "Test - Regression" run found');
              return;
            }
            core.setOutput('run_id', runs.data.workflow_runs[0].id);

      - name: Find latest successful "Build - HW documentation" run
        id: find_doc_run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-doc.yml',
              status: 'success',
              per_page: 1,
            });
            if (runs.data.workflow_runs.length === 0) {
              core.setFailed('No successful "Build - HW documentation" run found');
              return;
            }
            core.setOutput('run_id', runs.data.workflow_runs[0].id);

      - name: Download regression-test Pages content
        uses: actions/download-artifact@v4
        with:
          name: regression-pages-content
          path: public
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find_regression_run.outputs.run_id }}

      - name: Download HW documentation Pages content
        uses: actions/download-artifact@v4
        with:
          name: doc-pages-content
          path: public
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find_doc_run.outputs.run_id }}

      - name: Generate merged directory indexes
        uses: gacts/directory-listing@v1
        with:
          target: public

      - name: Upload merged Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
