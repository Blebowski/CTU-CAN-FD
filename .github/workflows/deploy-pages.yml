name: Deploy Pages

# Runs whenever either content-producing workflow finishes, merges their
# outputs, and does the single actual GitHub Pages deployment. Each producer
# workflow (regression-test, build-doc) only uploads its own content as a
# plain artifact; deploying it directly from either would wipe out whatever
# the other last published, since GitHub Pages deployment fully replaces the
# site on every deploy rather than merging.
on:
  workflow_run:
    workflows:
      - "Test - Regression"
      - "Build - HW documentation"
    types:
      - completed

jobs:
  merge_and_deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Neither "find latest run" step hard-fails when it can't find one -
      # a missing/expired source just means the merged site is published
      # with only the other producer's content (see the corresponding
      # download steps below), not a broken deploy.
      - name: Find latest successful "Test - Regression" run
        id: find_regression_run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'regression-test.yml',
              status: 'success',
              per_page: 1,
            });
            if (runs.data.workflow_runs.length === 0) {
              core.warning('No successful "Test - Regression" run found - deploying without its content');
              return;
            }
            core.setOutput('run_id', runs.data.workflow_runs[0].id);

      - name: Find latest successful "Build - HW documentation" run
        id: find_doc_run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-doc.yml',
              status: 'success',
              per_page: 1,
            });
            if (runs.data.workflow_runs.length === 0) {
              core.warning('No successful "Build - HW documentation" run found - deploying without its content');
              return;
            }
            core.setOutput('run_id', runs.data.workflow_runs[0].id);

      # continue-on-error also covers the case where a run was found but its
      # artifact already expired/is missing - either way, missing content
      # from one producer must not block deploying the other's.
      - name: Download regression-test Pages content
        id: download_regression
        if: steps.find_regression_run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: regression-pages-content
          path: public
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find_regression_run.outputs.run_id }}

      - name: Download HW documentation Pages content
        id: download_doc
        if: steps.find_doc_run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: doc-pages-content
          path: public
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find_doc_run.outputs.run_id }}

      - name: Warn about any missing content
        if: steps.download_regression.outcome != 'success' || steps.download_doc.outcome != 'success'
        run: |
          if [ "${{ steps.download_regression.outcome }}" != "success" ]; then
            echo "::warning::Regression-test Pages content unavailable - deploying without it"
          fi
          if [ "${{ steps.download_doc.outcome }}" != "success" ]; then
            echo "::warning::HW documentation Pages content unavailable - deploying without it"
          fi

      - name: Fail if no content is available at all
        run: |
          if [ -z "$(ls -A public 2>/dev/null)" ]; then
            echo "Neither producer's content is available - refusing to deploy an empty site" >&2
            exit 1
          fi

      - name: Generate merged directory indexes
        uses: gacts/directory-listing@v1
        with:
          target: public

      - name: Upload merged Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
