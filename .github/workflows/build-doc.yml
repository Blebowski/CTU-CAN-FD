name: Build - HW documentation

on: [push, pull_request]

jobs:

  build_hw_docs:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/logic-design-services/lyx-docu

    permissions:
      contents: read
      packages: read

    steps:
      - name: Fix git safe.directory issue
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Build Datasheet"
        run: |
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8
          rm -rf pages
          mkdir pages
          make -C doc/datasheet
          mv doc/datasheet/ctu_can_fd_datasheet.pdf pages

      - name: "Build System Architecture"
        run: |
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8
          make -C doc/system_architecture
          mv doc/system_architecture/ctu_can_fd_architecture.pdf pages/ctu_can_fd_architecture.pdf

      - name: "Build Testbench documentation"
        run: |
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8
          make -C doc/testbench
          mv doc/testbench/ctu_can_fd_testbench.pdf pages/ctu_can_fd_testbench.pdf

      - name: "Build Linux Driver documentation"
        run: |
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8
          rm -rf pages/linux_driver
          mkdir pages/linux_driver
          make -C doc/driver
          mv doc/driver/build/* pages/linux_driver

      # Actual Pages deployment is centralized in the "Deploy Pages" workflow,
      # which merges this content with the regression-test output before
      # publishing - this job only publishes its content as a plain artifact
      # for that workflow to pick up.
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doc-pages-content
          path: pages
          retention-days: 90
